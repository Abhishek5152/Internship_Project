{% extends "manager/man_layout.html" %}

{% block content %}
            <div class="page-content">
                <!-- Page Header-->
                <div class="page-header no-margin-bottom">
                <div class="container-fluid">
                    <h2 class="h5 no-margin-bottom">Request History</h2>
                </div>
                </div>
                <!-- Breadcrumb-->
                <div class="container-fluid">
                <ul class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{{ url_for('manager.mandash') }}">Home</a></li>
                    <li class="breadcrumb-item active">Request History</li>
                </ul>
                </div>
                <section class="no-padding-top">
                <div class="container-fluid">
                    <div class="row">
                    <div class="col-lg-12">
                        <div class="block">
                        <div class="title"><strong>Request History</strong></div>
                        <div class="table-responsive"> 
                            <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                <th>Requester name</th>
                                <th>Resource</th>
                                <th>Request Date</th>
                                <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for req in requests %}
                                <tr>
                                    <td>{{ req[0] }}</td>  <!-- Requester name -->
                                    <td>{{ req[1] }}</td>  <!-- Resource -->
                                    <td>{{ req[2] }}</td>  <!-- Request Date -->
                                    <td>{{ req[3] }}</td>  <!-- Status -->
                                </tr>
                                {% endfor %}
                            </tbody>
                            </table>
                        </div>
                        </div>
                    </div>
                    </div>
                    </div>
                </div>
                </section>
{% endblock %}
